name: CI

# A pull request runs every job once; a push runs them only on main, where the merge result is checked again.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: '3.13'
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest --cov=hopwatch --cov-report=json
      - run: uv build
      - uses: actions/upload-artifact@v7
        with:
          name: python-coverage
          path: coverage.json

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run docs:build
      - uses: actions/upload-artifact@v7
        with:
          name: node-coverage
          path: coverage/coverage-final.json
        if: github.event_name == 'pull_request'

  coverage:
    name: Incremental coverage check
    runs-on: ubuntu-latest
    needs: [python, node]
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          pattern: '*-coverage'
          merge-multiple: true
      - uses: velis74/incremental-coverage-check@v3
        with:
          coverage-files: |
            coverage.json
            coverage-final.json
          extra-ignore-patterns: |
            docs/**
            scripts/**
          base-ref: ${{ github.base_ref }}
          head-ref: HEAD
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pr-number: ${{ github.event.pull_request.number }}

  # the required status check: fails when any other job of this workflow failed or was cancelled
  all-green:
    if: always()
    needs: [python, node, coverage]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
