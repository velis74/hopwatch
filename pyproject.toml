[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"

[project]
name = "hopwatch"
version = "0.0.1"
description = "Real-time public transport information: timetables, vehicle positions and rider reports."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Jure Erznožnik", email = "jure.erznoznik@velis.si" },
]
requires-python = ">=3.13"
classifiers = [
    "Development Status :: 1 - Planning",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = []

[dependency-groups]
dev = [
    "coverage",
    "pytest",
    "pytest-cov",
    "ruff",
]

[project.urls]
Homepage = "https://github.com/velis74/hopwatch"
Repository = "https://github.com/velis74/hopwatch"
Issues = "https://github.com/velis74/hopwatch/issues"
Documentation = "https://docs.velis.si/hopwatch/"

[tool.uv.build-backend]
module-name = "hopwatch"
module-root = ""

[tool.ruff]
exclude = ['*.md', 'dist', 'build', 'node_modules', '.git', '.idea', '.vscode', '.pytest_cache', '.ruff_cache',
    '.venv']
line-length = 120

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "Q",    # flake8-quotes
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "N",    # pep8-naming
    "PT",   # flake8-pytest-style
    "S",    # flake8-bandit
    "C4",   # flake8-comprehensions
    "ARG",  # flake8-unused-arguments
]
ignore = ["E731", "E722", "C408"]
fixable = ["ALL"]
unfixable = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
"*_test.py" = ["S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.isort]
case-sensitive = false
lines-between-types = 1
combine-as-imports = true
order-by-type = false

[tool.coverage.run]
omit = ["*_test.py"]

[tool.pytest.ini_options]
testpaths = ["hopwatch"]
python_files = ["*_test.py"]
